name: redmi_ax6000_new
on:
  schedule:
    # GitHub Actions cron 固定使用 UTC 时区（UTC+0，比北京时间慢 8 小时）：
    # - 设定 UTC 周二 15:07（对应北京时间周二 23:07）
    # - 结合 GitHub Actions schedule 实测约 7h10m~7h45m 的调度延迟，实际在 UTC 周二 22:20~22:50（北京时间周三 06:20~06:50）启动
    # - 加上约 1h30m 编译发版耗时，预计在北京时间每周三早上 08:00 左右（UTC 周三 00:00 左右）执行完成
    - cron: '7 15 * * 2'
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 删除 Boost 预装目录与临时目录（其余大目录已由 free-disk-space 快速清理，保留已预装的 clang-18/cmake 等工具）
          sudo rm -rf /usr/local/share/boost || true
          rm -rf "$RUNNER_TEMP"/* || true

          # 若 apt mirror 列表包含限速严重的 AWS EC2 镜像且存在备用官方源，则移除 EC2 镜像以避免 50KB/s 慢速下载
          if [ -f /etc/apt/apt-mirrors.txt ] && [ "$(wc -l < /etc/apt/apt-mirrors.txt)" -gt 1 ]; then
            sudo sed -i '/\.ec2\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          fi

          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt-get update

          # 使用 --no-install-recommends 避免 asciidoc 连带安装 ~1.4GB 的 texlive/openjdk/mupdf 推荐包，并一次性装齐 Clang 18
          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            asciidoc autoconf automake autopoint binutils bison \
            ccache cmake cpio curl device-tree-compiler flex gawk \
            gettext git libncurses5-dev libssl-dev libelf-dev libtool \
            pkg-config python3 rsync subversion swig \
            zlib1g-dev unzip file time jq upx-ucl p7zip-full aria2 wget \
            texinfo qemu-utils genisoimage \
            clang-18 lld-18 libc++-18-dev libc++abi-18-dev ninja-build

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang++ --version

          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4

      - name: Clone source code
        env:
          REPO_URL: https://github.com/coolsnowwolf/lede.git
          REPO_BRANCH: master
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Add new feed from lienol
        run: |
          cd openwrt/package/lean && rm -rf luci-theme-argon && git clone https://github.com/jerrykuku/luci-theme-argon.git luci-theme-argon
          cd ../.. && rm -f feeds.conf.default && cp ../feeds.conf.default feeds.conf.default
          mkdir -p files/usr/share/v2ray files/usr/share/xray && cd files/usr/share/v2ray && wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat && wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat && cp geoip.dat geosite.dat ../xray/
          
          

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt && ./scripts/feeds install -a
          for pkg in luci luci-base luci-mod-admin-full luci-mod-network luci-mod-status luci-mod-system; do
            if [ ! -f "package/feeds/luci/$pkg/Makefile" ]; then
              echo "ERROR: Required LuCI package '$pkg' is missing after feeds install!" >&2
              exit 1
            fi
          done

      - name: remove Nodes
        run: sed -i 's/DEPENDS:=@(HAS_FPU||KERNEL_MIPS_FPU_EMULATOR||SOFT_FLOAT)/DEPENDS:=@(HAS_FPU||KERNEL_MIPS_FPU_EMULATOR)/g' ./openwrt/feeds/packages/lang/node/Makefile

      - name: Disable manpages for kmod
        run: |
          # Patch kmod Makefile to disable manpages build to avoid requiring scdoc
          # This is needed because scdoc is not available in the build environment
          # and manpages are not required for the router firmware
          cd openwrt/feeds/packages/utils/kmod
          if ! grep -q "disable-manpages" Makefile; then
            # Use awk to insert CONFIGURE_ARGS after the package.mk include line
            # Note: \$ and \. are escaped for shell/regex matching
            awk '/^include \$\(INCLUDE_DIR\)\/package\.mk/ {print; print ""; print "CONFIGURE_ARGS += --disable-manpages"; next} 1' Makefile > Makefile.tmp
            mv Makefile.tmp Makefile
          fi

      - name: Fix upstream build issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Fix coolsnowwolf/lede b77bd85 verbose.mk regression breaking json_overview_image_info.py
          json_script = Path("openwrt/scripts/json_overview_image_info.py")
          if json_script.is_file():
              content = json_script.read_text()
              target = '"val.ARCH_PACKAGES",\n        ],'
              replacement = '"val.ARCH_PACKAGES",\n            "V=s",\n        ],'
              if '"V=s"' not in content and target in content:
                  json_script.write_text(content.replace(target, replacement, 1))
                  print("Patched scripts/json_overview_image_info.py to pass V=s")

          # 2) Fix tools/dwarves parallel build race while tools/cmake is mid-install
          tools_mk = Path("openwrt/tools/Makefile")
          if tools_mk.is_file():
              content = tools_mk.read_text()
              old_dep = "$(curdir)/dwarves/compile += $(curdir)/elfutils/compile\n"
              new_dep = "$(curdir)/dwarves/compile += $(curdir)/elfutils/compile $(curdir)/cmake/compile\n"
              if old_dep in content:
                  tools_mk.write_text(content.replace(old_dep, new_dep, 1))
                  print("Patched tools/Makefile: added cmake dependency for dwarves")

          # 3) Add GitHub codeload primary mirror for tools/erofs-utils (git.kernel.org snapshot blocks/timeouts runner IPs)
          erofs_mk = Path("openwrt/tools/erofs-utils/Makefile")
          if erofs_mk.is_file():
              content = erofs_mk.read_text()
              old_url = "PKG_SOURCE_URL=https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/"
              new_url = "PKG_SOURCE_URL=https://codeload.github.com/erofs/erofs-utils/tar.gz/v$(PKG_VERSION)? https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/snapshot/"
              if "codeload.github.com/erofs/erofs-utils" not in content and old_url in content:
                  erofs_mk.write_text(content.replace(old_url, new_url, 1))
                  print("Patched tools/erofs-utils/Makefile: added GitHub codeload mirror")

          # 4) Fix mac80211 backports-6.18.39 build against Linux >= 6.18.65
          #    Linux 6.18.65 backported e3b2cf6e5dba ("kernfs: pass struct ns_common instead of const void *"),
          #    changing struct class::namespace return type from `const void *` to `const struct ns_common *`.
          mac80211_patches = Path("openwrt/package/kernel/mac80211/patches")
          if mac80211_patches.is_dir():
              existing_sysfs = mac80211_patches / "build" / "150-sysfs-backport.patch"
              if existing_sysfs.is_file():
                  txt = existing_sysfs.read_text()
                  if "LINUX_VERSION_IS_GEQ(7,0,0)" in txt:
                      existing_sysfs.write_text(txt.replace("LINUX_VERSION_IS_GEQ(7,0,0)", "LINUX_VERSION_IS_GEQ(6,18,65)"))
                      print("Updated mac80211 150-sysfs-backport.patch threshold to 6.18.65")
              elif not any("wiphy_namespace" in p.read_text(errors="ignore") for p in mac80211_patches.rglob("*.patch")):
                  patch_file = mac80211_patches / "build" / "503-fix-wiphy-namespace-6.18.65.patch"
                  patch_file.write_text(
                      "--- a/net/wireless/sysfs.c\n"
                      "+++ b/net/wireless/sysfs.c\n"
                      "@@ -154,12 +154,21 @@ static SIMPLE_DEV_PM_OPS(wiphy_pm_ops, w\n"
                      " #define WIPHY_PM_OPS NULL\n"
                      " #endif\n"
                      " \n"
                      "+#if LINUX_VERSION_IS_GEQ(6,18,65)\n"
                      "+static const struct ns_common *wiphy_namespace(const struct device *d)\n"
                      "+{\n"
                      "+\tstruct wiphy *wiphy = container_of(d, struct wiphy, dev);\n"
                      "+\n"
                      "+\treturn to_ns_common(wiphy_net(wiphy));\n"
                      "+}\n"
                      "+#else\n"
                      " static const void *wiphy_namespace(const struct device *d)\n"
                      " {\n"
                      " \tstruct wiphy *wiphy = container_of(d, struct wiphy, dev);\n"
                      " \n"
                      " \treturn wiphy_net(wiphy);\n"
                      " }\n"
                      "+#endif\n"
                      " \n"
                      " struct class ieee80211_class = {\n"
                      " \t.name = \"ieee80211\",\n"
                  )
                  print("Added mac80211 build/503-fix-wiphy-namespace-6.18.65.patch")
          PY

      - name: Custom configure file
        run: |
          cd openwrt
          rm -f .config
          cp ../ax6000 .config

      - name: Make Defconfig
        run: |
          cd openwrt
          make defconfig

      - name: Make download
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Multi-thread compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread build."
          make -j$(nproc)

      - name: Single-thread compile
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s

      - name: Get current date
        id: currentdate
        run: echo "date=$(date +'%Y-%m-%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Assemble artifact
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          find openwrt/bin/targets/ -name "*sysupgrade*bin*" | xargs -i mv -f {} ./artifact/${{ steps.currentdate.outputs.date }}.bin
          find openwrt/bin/targets/ -name "*.bin*" | xargs -i mv -f {} ./artifact/
          mv -f openwrt/bin/packages ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: OpenWrt firmware
          path: ./artifact/

      - name: Create Release and upload assets
        id: release-asset
        uses: ncipollo/release-action@v1
        with:
          tag: "RedMi_AX6000_${{ steps.currentdate.outputs.date }}"
          name: "RedMi_AX6000_${{ steps.currentdate.outputs.date }}"
          makeLatest: true
          generateReleaseNotes: true
          artifacts: "./artifact/*.bin,./artifact/**/*.ipk"
          body: |
            ## Release Notes 
            - This release includes the firmware for RedMi AX6000 boards.
            - Please find the binary files in the assets section below.
            
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ssh_host }}
          username: ${{ secrets.ssh_user }}
          password: ${{ secrets.ssh_pass }}
          port: ${{ secrets.ssh_port }}
          script: |
            TARGET="/tmp/${{ steps.currentdate.outputs.date }}.bin"
            curl -4 -f -o "$TARGET" -L https://github.com/hcwang/openwrt-actions/releases/download/RedMi_AX6000_${{ steps.currentdate.outputs.date }}/${{ steps.currentdate.outputs.date }}.bin
            if [ -s "$TARGET" ]; then
              nohup sysupgrade -v "$TARGET" >/dev/null 2>&1 &
            else
              echo "Downloaded firmware is empty or missing, aborting sysupgrade." && exit 1
            fi
